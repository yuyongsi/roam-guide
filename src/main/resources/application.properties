spring.application.name=roam-guide
server.address=127.0.0.1
server.port=8818
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=60m
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.thymeleaf.cache=false
spring.web.resources.cache.period=3600
server.error.include-message=never
logging.level.root=WARN
logging.level.cn.edu.travel=INFO
roam.logging.directory=${ROAM_LOG_DIR:${ROAM_DATA_DIR:data}/logs}
roam.logging.max-file-size=5MB
roam.logging.max-history=14
roam.logging.total-size-cap=50MB
